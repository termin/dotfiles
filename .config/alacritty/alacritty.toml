[general]
live_config_reload = true
import = ["/Users/termin/.config/alacritty/dracula.toml"]

[font]
size = 18.0

[font.bold]
# family = "Ricty ShinDiminished"
family = "Bizin Gothic"
# family = "NOTONOTO35"
style = "Bold"

[font.normal]
# family = "Ricty ShinDiminished"
family = "Bizin Gothic"
# family = "NOTONOTO35"
style = "Regular"

[window]
opacity = 0.95
# option_as_alt = "OnlyLeft"
# 有効にするとBackslashが入力出来ない

[window.padding]
x = 5
y = 5
[keyboard]
bindings = [
  { key = "Backslash", mods = "Alt", chars = "\\" },
]

